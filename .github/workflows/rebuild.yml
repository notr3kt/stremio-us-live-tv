name: Rebuild channel list from iptv-org
on:
  schedule: [{cron: "0 6 * * 1"}]   # weekly, Monday 06:00 UTC
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python build.py docs && touch docs/.nojekyll
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs && (git diff --cached --quiet || git commit -m "Rebuild channel list from iptv-org") && git push
